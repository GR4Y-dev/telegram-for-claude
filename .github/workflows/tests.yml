name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install requirements
        run: pip install -r telegram-connector/requirements.txt -r telegram-caller/requirements.txt
      - name: Check dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r telegram-connector/requirements.txt -r telegram-caller/requirements.txt
      - name: Check the setup scripts
        run: bash -n telegram-connector/setup.sh && bash -n telegram-caller/setup.sh && bash -n telegram-caller/setup-guests.sh && bash -n update.sh
      - name: Updater tests
        run: bash tests/test_update.sh
      - name: Connector tests
        env:
          RUN_PUBLIC_DOWNLOAD: "1"
        run: python tests/test_connector.py
      - name: Call assistant tests
        env:
          SKIP_CLAUDE: "1"
        run: python tests/test_caller.py
      - name: Text chat tests (offline)
        run: |
          python -m unittest discover -s tests -p test_chat.py -v
          python -m unittest discover -s tests -p 'test_assistant_*.py' -v
          python -m unittest discover -s tests -p 'test_security.py' -v
          python -m unittest discover -s tests -p 'test_transfers.py' -v
          REQUIRE_FFMPEG=1 python tests/test_video.py -v
          python -m unittest discover -s tests -p 'test_video_chat.py' -v
          python -m unittest discover -s tests -p 'test_runtime.py' -v
          python -m unittest discover -s tests -p 'test_build_images.py' -v
          python -m unittest discover -s tests -p 'test_guests.py' -v
          python -m unittest discover -s tests -p 'test_guest_setup.py' -v
      - name: Build the connector image
        run: |
          docker build -q -t telegram-connector-test telegram-connector
          docker run --rm -e REQUIRE_FFMPEG=1 -e PYTHONPATH=/app -v "$PWD/tests:/tests:ro" telegram-connector-test python /tests/test_video.py RealVideoTests -v
          docker image inspect telegram-connector-test --format 'Connector image bytes: {{.Size}}'
          docker history telegram-connector-test --format '{{.Size}} {{.CreatedBy}}' | awk '/apt-get/{print "Distro media layer:", $0}'
      - name: Guest container isolation and cancellation (no provider calls)
        run: |
          docker build -t telegram-guest-claude:2.1.286 telegram-caller/guest-runtime
          sudo env RUN_GUEST_DOCKER_TESTS=1 python3 tests/test_guest_isolation.py -v
          sudo python3 tests/test_guest_cli.py
